services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sitepilot
      POSTGRES_PASSWORD: sitepilot
      POSTGRES_DB: sitepilot
    ports:
      - '127.0.0.1:5444:5432'
    volumes:
      - sitepilot_mastra_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepilot -d sitepilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - '127.0.0.1:6391:6379'
    volumes:
      - sitepilot_mastra_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sitepilot_mastra_pg:
  sitepilot_mastra_redis:
